# ห่อ www/index.html เป็นแอพ Android ด้วย Capacitor แล้วปล่อยไฟล์ .apk ในหน้า Releases
# CapacitorHttp ส่งคำขอ fetch ผ่านระบบ Android โดยตรง จึงเรียก Binance / CoinGecko / AI ได้โดยไม่ติด CORS (แทน server.py)
name: Build Crypto Scanner APK

on:
  push:
    branches: [crypto-scanner]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: ติดตั้ง Capacitor และฝังไลบรารีกราฟไว้ในแอพ
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android lightweight-charts@4.1.3
          cp node_modules/lightweight-charts/dist/lightweight-charts.standalone.production.js www/
          sed -i 's#https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js#lightweight-charts.standalone.production.js#' www/index.html
          grep -n "lightweight-charts" www/index.html | head -2

      - name: สร้างโปรเจกต์ Android
        run: |
          npx cap add android
          # อนุญาต http ธรรมดา (สำหรับ Ollama / LM Studio บนคอมในบ้าน)
          sed -i 's#<application#<application android:usesCleartextTraffic="true"#' android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../crypto-scanner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: crypto-scanner-apk
          path: crypto-scanner.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: crypto-${{ github.run_number }}
          name: Crypto Scanner build ${{ github.run_number }}
          target_commitish: crypto-scanner
          files: crypto-scanner.apk
