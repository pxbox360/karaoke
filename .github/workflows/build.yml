# ห่อ www/index.html เป็นแอพ Android ด้วย Capacitor แล้วปล่อยไฟล์ .apk ในหน้า Releases
name: Build Crypto Heatmap APK

on:
  push:
    branches: [crypto-heatmap]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: สร้างโปรเจกต์ Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../crypto-heatmap.apk
      - uses: actions/upload-artifact@v4
        with:
          name: crypto-heatmap-apk
          path: crypto-heatmap.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: heatmap-${{ github.run_number }}
          name: Crypto Heatmap build ${{ github.run_number }}
          target_commitish: crypto-heatmap
          files: crypto-heatmap.apk
