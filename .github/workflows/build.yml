# สร้างไฟล์ .apk ของแอพ Seal Battery (WebView + index.html) แล้วปล่อยในหน้า Releases
name: Build Seal Battery APK

on:
  push:
    branches: [seal-battery]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk seal-battery.apk
      - uses: actions/upload-artifact@v4
        with:
          name: seal-battery-apk
          path: seal-battery.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: seal-${{ github.run_number }}
          name: Seal Battery build ${{ github.run_number }}
          target_commitish: seal-battery
          files: seal-battery.apk
