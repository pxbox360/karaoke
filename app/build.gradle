plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.bydseal.batterypro'
    compileSdk 34

    defaultConfig {
        applicationId "com.bydseal.batterypro"
        minSdk 28
        targetSdk 33
        versionCode 5
        versionName "4.1-OBD2"
    }

    // กุญแจเซ็นคงที่ ติดตั้งทับเวอร์ชันถัดไปได้
    signingConfigs {
        debug {
            storeFile file('seal-debug.keystore')
            storePassword 'android'
            keyAlias 'sealdebug'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
