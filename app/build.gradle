plugins { id 'com.android.application' }

android {
    namespace 'com.sealbattery.obd'
    compileSdk 34

    defaultConfig {
        applicationId 'com.sealbattery.obd'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    // คีย์สำหรับเซ็นแอพใช้เอง ทำให้ติดตั้งเวอร์ชันใหม่ทับของเดิมได้
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
